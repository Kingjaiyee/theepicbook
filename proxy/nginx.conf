# JSON access log: path only (no query string), no cookies or auth headers
log_format json_safe escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
  '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/access.json json_safe;
    error_log  /var/log/nginx/error.log warn;

    # Docker's DNS: look up containers at request time, so a restarted
    # backend with a new IP is found again
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_app     http://backend:8080;
    set $frontend_static http://frontend:80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;

    # Proxy's own health check: localhost only
    location = /proxy-health {
        access_log off;
        default_type text/plain;
        # "return" runs before allow/deny, so check the caller here
        if ($remote_addr != "127.0.0.1") { return 403; }
        return 200 "ok\n";
    }

    # Static frontend assets -> frontend (Nginx)
    location /assets/ {
        proxy_pass $frontend_static;
        expires 7d;
    }

    # API requests -> backend
    location /api/ {
        proxy_pass $backend_app;
    }

    # Application health (checks the database) -> backend
    location = /health {
        proxy_pass $backend_app;
    }

    # Application pages (/, /cart, /gallery, /category/...) -> backend
    location / {
        proxy_pass $backend_app;
    }
}
