name: epicbook

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      # Schema and seeds run once, in this order, only when db_data is empty
      - ./db/BuyTheBook_Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/author_seed.sql:/docker-entrypoint-initdb.d/02-authors.sql:ro
      - ./db/books_seed.sql:/docker-entrypoint-initdb.d/03-books.sql:ro
    networks: [back-tier]
    # No ports: reachable only as database:3306 on back-tier
    healthcheck:
      # TCP on 127.0.0.1, not the socket, so MySQL's temporary init server cannot pass it
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  backend:
    build:
      context: ./backend
    image: ghcr.io/kingjaiyee/epicbook-backend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      JAWSDB_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}
    networks: [front-tier, back-tier]
    # No ports: the proxy reaches it as backend:8080
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/kingjaiyee/epicbook-frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    networks: [front-tier]
    # No ports: the proxy reaches it as frontend:80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/assets/css/style.css"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *default-logging

  reverse-proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/proxy:/var/log/nginx
    networks: [front-tier]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/proxy-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *default-logging

networks:
  front-tier:
    name: front-tier
  back-tier:
    name: back-tier
    internal: true

volumes:
  db_data:
