name: build-push-deploy

on:
  push:
    branches: [capstone/docker]
    paths:
      - "backend/**"
      - "frontend/**"
      - "proxy/**"
      - "docker-compose.yml"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: kingjaiyee

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/epicbook-backend:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/epicbook-frontend:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy to EC2 (approval required)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Run deploy script on the VM through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          SCRIPT="cd /home/ubuntu/theepicbook && git fetch -q origin capstone/docker && git checkout -q --detach ${GITHUB_SHA} && ./scripts/deploy.sh ${TAG}"
          PARAMS=$(jq -nc --arg s "$SCRIPT" '{commands: ["sudo -u ubuntu bash -c " + ($s | @sh)]}')
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "epicbook deploy ${TAG}" \
            --parameters "$PARAMS" --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "status: $STATUS"
          [ "$STATUS" = "Success" ] || { aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text; exit 1; }

  verify:
    name: Verify public health
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check /health through the reverse proxy
        env:
          APP_URL: http://${{ vars.APP_PUBLIC_IP }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS "$APP_URL/health" | tee /dev/stderr | grep -q '"database":"up"'; then
              echo "verified: $APP_URL/health is up"; exit 0
            fi
            sleep 6
          done
          echo "health check failed" >&2; exit 1
