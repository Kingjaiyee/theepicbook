[defaults]
inventory              = inventory/hosts.ini
host_key_checking      = True
retry_files_enabled    = False
interpreter_python     = auto_silent
timeout                = 30
callback_result_format = yaml

[ssh_connection]
pipelining = True
# Trust only the host keys verified through Azure Run Command (committed in this folder)
ssh_args   = -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s
